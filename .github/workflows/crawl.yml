name: Crawl career pages

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies to crawl (0 = all)"
        default: "200"
      offset:
        description: "Skip the first N companies (for chunked runs)"
        default: "0"
      dry_run:
        description: "Dry run (fetch and count only, send nothing)"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (04:17 Lagos)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Download company list (LastRound AI ATS Company Directory, CC BY 4.0)
        run: |
          if [ ! -f data/ats_directory.csv ]; then
            curl -fsSL --retry 3 -o data/ats_directory.csv "https://datahub.io/lastroundai-hiring-data/lastroundai-hiring-data/_r/-/ats-directory/lastroundai-ats-company-directory-2026-08.csv" \
              && echo "Downloaded $(wc -l < data/ats_directory.csv) lines" \
              || echo "Download failed - falling back to data/seed_companies.csv"
          fi
          head -3 data/ats_directory.csv 2>/dev/null || true
      - name: Self-test
        run: python tests/selftest.py
      - name: Crawl
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: https://careerdrops.com/api/public/ingest-jobs
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          OFFSET="${{ github.event.inputs.offset || '0' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS="--limit $LIMIT --offset $OFFSET --max-minutes 300"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--rotate 3500 --max-minutes 300"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python crawl.py $ARGS
